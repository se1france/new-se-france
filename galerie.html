<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temps forts · Spirit Embassy France</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="liens.js"></script>
</head>
<body>
  <div class="liseret"></div>
  <header><nav>
    <a href="index.html" class="logo" data-c="nom"></a>
    <div class="liens"><a href="index.html">Accueil</a><a href="zoom.html">Zoom</a><a href="don.html">Donner</a>
      <a href="inscription.html" class="bouton">Je m'inscris</a></div>
  </nav></header>

  <main>
    <section class="formulaire">
      <h1>Temps forts</h1>
      <p class="sous">Revivez les moments marquants de notre église.</p>
    </section>
    <div class="carrousel" id="carrousel">
      <div class="piste" id="piste"></div>
      <button class="fleche g" id="prec" aria-label="Précédent">‹</button>
      <button class="fleche d" id="suiv" aria-label="Suivant">›</button>
      <div class="points" id="points"></div>
    </div>
    <p class="aucune" id="vide" style="text-align:center"></p>
  </main>

  <footer><p class="titre" data-c="devise"></p><p data-c="adresse"></p></footer>
  <div class="liseret"></div>

<script>
const esc = s => String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"<",">":">",'"':"&quot;","'":"&#39;"}[c]));
let n = 0, i = 0, minuteur;
const piste = document.getElementById("piste"), points = document.getElementById("points");

function aller(k) {
  i = (k + n) % n;
  piste.style.transform = "translateX(-" + i * 100 + "%)";
  [...points.children].forEach((p, j) => p.classList.toggle("actif", j === i));
}
function demarrer() { clearInterval(minuteur); minuteur = setInterval(() => aller(i + 1), 5000); }

fetch(LIENS.scriptGalerie).then(r => r.json()).then(liste => {
  n = liste.length;
  if (!n) { document.getElementById("carrousel").classList.add("masque");
            document.getElementById("vide").textContent = "Les photos arrivent bientôt."; return; }
  piste.innerHTML = liste.map(p => `
    <div class="diapo"><img loading="lazy" alt="${esc(p.titre)}"
      src="https://drive.google.com/thumbnail?id=${encodeURIComponent(p.id)}&sz=w1600">
      <div class="legende"><strong>${esc(p.titre)}</strong>${esc(p.date)}</div></div>`).join("");
  points.innerHTML = liste.map((_, j) => `<span data-j="${j}"></span>`).join("");
  aller(0); demarrer();
}).catch(() => {
  document.getElementById("carrousel").classList.add("masque");
  document.getElementById("vide").textContent = "Galerie momentanément indisponible.";
});

document.getElementById("prec").onclick = () => { aller(i - 1); demarrer(); };
document.getElementById("suiv").onclick = () => { aller(i + 1); demarrer(); };
points.onclick = e => { if (e.target.dataset.j) { aller(+e.target.dataset.j); demarrer(); } };
const car = document.getElementById("carrousel");
car.onmouseenter = () => clearInterval(minuteur);
car.onmouseleave = demarrer;
let x0 = null;
car.addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
car.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) { aller(i + (dx < 0 ? 1 : -1)); demarrer(); }
  x0 = null;
});
</script>
</body>
</html>
